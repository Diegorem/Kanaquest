<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bunpo" />
  <meta name="theme-color" content="#0B0F19" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" />
  <title>Bunpo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bunpo: {
              darkBg: '#0B0F19',
              darkCard: '#151C2C',
              darkBorder: '#232D42',
              lightBg: '#F6F8FC',
              lightCard: '#FFFFFF',
              lightBorder: '#E5E9F2',
              accent: '#5865F2',
              accentSoft: '#4752C4'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
    }

    .jp-font {
      font-family: 'Noto Sans JP', sans-serif;
    }

    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.56em;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.85;
      transform: translateY(-2px);
    }

    body.hide-furigana rt {
      visibility: hidden;
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }

    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pt-tag {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 6px;
      font-weight: 700;
      background: rgba(88, 101, 242, 0.18);
      color: #818CF8;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    html:not(.dark) .pt-tag {
      background: rgba(88, 101, 242, 0.12);
      color: #4F46E5;
      border-color: rgba(79, 70, 229, 0.25);
    }

    .word-token {
      display: inline-block;
      padding: 2px 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
    }
    .word-token:active {
      background: rgba(88, 101, 242, 0.25);
    }

    canvas.draw-pad {
      touch-action: none;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.15) 1px, transparent 1px);
      background-size: 50% 50%;
    }
  </style>
</head>
<body class="bg-bunpo-lightBg dark:bg-bunpo-darkBg text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden flex flex-col transition-colors duration-200">

  <!-- TOP HEADER -->
  <header class="safe-top px-4 pb-3 bg-bunpo-lightCard/95 dark:bg-bunpo-darkCard/95 backdrop-blur-md border-b border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-bunpo-accent flex items-center justify-center text-white font-extrabold text-lg shadow-sm jp-font">
        文
      </div>
      <div>
        <h1 class="font-bold text-base tracking-tight leading-none">Bunpo</h1>
        <p id="header-subtitle" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">38 Capítulos • Kana + N5 Completo</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleFurigana()" id="furi-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-bunpo-lightBorder dark:border-bunpo-darkBorder bg-slate-100 dark:bg-slate-800/80 text-bunpo-accent dark:text-indigo-400 flex items-center gap-1">
        <span class="jp-font text-[11px]">あ</span> Furigana
      </button>

      <div class="px-2.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center gap-1 text-amber-500 font-bold text-xs">
        <span>🔥</span>
        <span id="streak-badge">1</span>
      </div>

      <button onclick="toggleTheme()" id="theme-btn" class="w-8 h-8 rounded-xl border border-bunpo-lightBorder dark:border-bunpo-darkBorder bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center text-sm" aria-label="Tema">
        🌙
      </button>
    </div>
  </header>

  <!-- COURSE TRACK SELECTOR (COMO EN LA PARTE SUPERIOR DE BUNPO) -->
  <div id="track-selector" class="bg-bunpo-lightCard dark:bg-bunpo-darkCard border-b border-bunpo-lightBorder dark:border-bunpo-darkBorder px-4 py-2.5 flex gap-2 overflow-x-auto no-scrollbar shrink-0">
    <button onclick="selectTrack('all')" id="track-all" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-bunpo-accent text-white">
      Todo (38)
    </button>
    <button onclick="selectTrack('hiragana')" id="track-hiragana" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
      1. Hiragana (9)
    </button>
    <button onclick="selectTrack('katakana')" id="track-katakana" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
      2. Katakana (6)
    </button>
    <button onclick="selectTrack('basics')" id="track-basics" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
      3. Palabras Base (3)
    </button>
    <button onclick="selectTrack('n5')" id="track-n5" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
      4. Gramática JLPT N5 (20)
    </button>
  </div>

  <!-- MAIN SCROLLABLE VIEWPORT -->
  <main id="main-view" class="flex-1 overflow-y-auto no-scrollbar pb-24">
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="safe-bottom bg-bunpo-lightCard/95 dark:bg-bunpo-darkCard/95 backdrop-blur-md border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder px-4 pt-2 flex justify-around items-center z-20 shrink-0">
    <button onclick="switchTab('course')" id="nav-course" class="flex flex-col items-center py-1 px-3 rounded-xl text-bunpo-accent">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span class="text-[11px] font-semibold">Curso</span>
    </button>

    <button onclick="switchTab('review')" id="nav-review" class="relative flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span class="text-[11px] font-semibold">Repaso</span>
      <span id="srs-badge" class="hidden absolute top-0.5 right-2 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>

    <button onclick="switchTab('kana')" id="nav-kana" class="flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <span class="jp-font text-lg font-bold leading-6 mb-0.5">あア</span>
      <span class="text-[11px] font-semibold">Kana</span>
    </button>

    <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[11px] font-semibold">Progreso</span>
    </button>
  </nav>

  <!-- FULLSCREEN LESSON & QUIZ MODAL -->
  <div id="lesson-modal" class="fixed inset-0 bg-bunpo-lightBg dark:bg-bunpo-darkBg z-40 hidden flex-col justify-between">
    <div class="safe-top px-4 pb-3 bg-bunpo-lightCard dark:bg-bunpo-darkCard border-b border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center gap-3">
      <button onclick="closeLessonModal()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-300 font-bold">
        ✕
      </button>
      <div class="flex-1 bg-slate-200 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
        <div id="lesson-progress-bar" class="bg-bunpo-accent h-full transition-all duration-300" style="width: 8%"></div>
      </div>
      <span id="lesson-step-counter" class="text-xs font-bold text-slate-400">1/10</span>
      <button onclick="toggleFurigana()" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 jp-font">
        振仮名
      </button>
    </div>

    <div id="lesson-body" class="flex-1 overflow-y-auto p-5 flex flex-col justify-between max-w-lg mx-auto w-full">
    </div>

    <div id="lesson-footer" class="safe-bottom px-5 pt-3 pb-4 bg-bunpo-lightCard dark:bg-bunpo-darkCard border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder max-w-lg mx-auto w-full">
      <div id="feedback-banner" class="hidden mb-3 p-3 rounded-xl text-sm font-medium"></div>
      <button id="lesson-action-btn" onclick="handleLessonAction()" class="w-full py-3.5 rounded-2xl bg-bunpo-accent hover:bg-bunpo-accentSoft text-white font-bold text-base shadow-lg shadow-indigo-500/20 transition active:scale-[0.99]">
        Continuar
      </button>
    </div>
  </div>

  <!-- WORD / KANA POPOVER -->
  <div id="word-popover" onclick="closeWordPopover()" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-end justify-center p-4">
  </div>

  <script>
    /**************************************************************
     * GENERADOR AUTOMÁTICO DE CAPÍTULOS DE KANA (18 CAPÍTULOS EXHAUSTIVOS)
     * Cada capítulo incluye:
     *  - Explicación estilo Bunpo con vocabulario real
     *  - Pizarra de trazo para CADA carácter del capítulo
     *  - 4 a 5 ejercicios variados (bloques, rellenar huecos, escritura/audio)
     **************************************************************/
    function buildKanaLesson({ id, number, title, desc, ruleTitle, ruleBody, chars, words }) {
      const formula = chars.map(c => `${c.char} (${c.romaji})`).join(' • ');
      const theory = [
        {
          heading: `Capítulo ${number}: ${ruleTitle}`,
          body: ruleBody,
          formula: formula,
          examples: words.map(w => ({
            jp: w.furiHtml || w.jp,
            tokens: [],
            romaji: w.romaji,
            es: w.es,
            audio: w.jp
          }))
        }
      ];

      const drawChars = chars.map(c => ({
        char: c.char,
        romaji: c.romaji,
        strokes: c.hint
      }));

      // Construir preguntas variadas usando las letras y palabras del capítulo
      const questions = [];
      const allCharSymbols = chars.map(c => c.char);

      // 1. Armar con bloques la palabra #1
      if (words[0]) {
        const w0 = words[0];
        const poolSet = new Set([...w0.blocks, ...allCharSymbols.slice(0, 3)]);
        questions.push({
          type: 'blocks',
          prompt: `Ordena los bloques para escribir **"${w0.es}"** (${w0.romaji}):`,
          audioHint: w0.jp,
          answer: w0.blocks,
          pool: Array.from(poolSet),
          explanation: `${w0.blocks.join(' + ')} forma **${w0.jp}** (${w0.romaji} = ${w0.es}).`
        });
      }

      // 2. Completar el carácter faltante en la palabra #2
      if (words[1]) {
        const w1 = words[1];
        const targetChar = w1.blocks[w1.blocks.length - 1];
        const prefix = w1.blocks.slice(0, w1.blocks.length - 1).join('');
        const distractors = allCharSymbols.filter(c => c !== targetChar).slice(0, 3);
        while (distractors.length < 3) {
          const fallback = ['あ', 'い', 'か', 'さ', 'た', 'な', 'ア', 'イ', 'カ'][distractors.length];
          if (fallback !== targetChar && !distractors.includes(fallback)) distractors.push(fallback);
          else distractors.push('ん');
        }
        const opts = [targetChar, ...distractors].sort(() => Math.random() - 0.5);
        questions.push({
          type: 'fill',
          prompt: `Completa la palabra para **"${w1.es}"** (${w1.romaji}):`,
          jpSentence: `${prefix} [ ___ ]`,
          options: opts,
          correct: targetChar,
          audio: w1.jp,
          explanation: `**${w1.jp}** (${w1.romaji}) significa "${w1.es}".`
        });
      }

      // 3. Armar con bloques la palabra #3
      if (words[2]) {
        const w2 = words[2];
        const poolSet = new Set([...w2.blocks, ...allCharSymbols.slice(-2)]);
        questions.push({
          type: 'blocks',
          prompt: `Forma con los bloques la palabra **"${w2.es}"** (${w2.romaji}):`,
          audioHint: w2.jp,
          answer: w2.blocks,
          pool: Array.from(poolSet),
          explanation: `**${w2.jp}** (${w2.romaji}) significa "${w2.es}".`
        });
      }

      // 4. Escribir la lectura en Romaji o Kana
      const targetWord = words[words.length - 1];
      questions.push({
        type: 'input',
        prompt: `Escribe cómo se lee en Romaji (o Kana) la palabra **"${targetWord.es}"**:`,
        jpDisplay: targetWord.jp,
        accepted: [targetWord.romaji.toLowerCase(), targetWord.jp],
        audio: targetWord.jp,
        explanation: `**${targetWord.jp}** se pronuncia **${targetWord.romaji}** (${targetWord.es}).`
      });

      return {
        id,
        title: `Cap. ${number}: ${title}`,
        desc,
        isKanaLesson: true,
        theory,
        drawChars,
        questions
      };
    }

    /**************************************************************
     * LOS 18 CAPÍTULOS COMPLETOS DE ALFABETO Y PALABRAS BASE (ESTILO BUNPO)
     **************************************************************/
    const HIRAGANA_LESSONS = [
      buildKanaLesson({
        id: 'kana-cap-1',
        number: 1,
        title: 'Vocales Hiragana: あ い う え お',
        desc: 'Las 5 vocales puras que sirven de base para todos los sonidos del japonés.',
        ruleTitle: 'Las 5 Vocales Japonesas',
        ruleBody: 'Todo el sistema fonético japonés gira en torno a 5 vocales puras y cortas: **あ (a), い (i), う (u), え (e), お (o)**. Nunca cambian su sonido sin importar en qué palabra estén.',
        chars: [
          { char: 'あ', romaji: 'a', hint: '3 trazos: línea horizontal, vertical curva y lazo amplio.' },
          { char: 'い', romaji: 'i', hint: '2 trazos verticales paralelos ligeramente curvos.' },
          { char: 'う', romaji: 'u', hint: '2 trazos: tilde corta superior y arco redondo inferior.' },
          { char: 'え', romaji: 'e', hint: '2 trazos: punto superior y base en forma de Z fluida.' },
          { char: 'お', romaji: 'o', hint: '3 trazos: cruz a la izquierda con bucle continuo y tilde a la derecha.' }
        ],
        words: [
          { jp: 'あい', romaji: 'ai', es: 'Amor', blocks: ['あ', 'い'] },
          { jp: 'うえ', romaji: 'ue', es: 'Arriba / Encima', blocks: ['う', 'え'] },
          { jp: 'あおい', romaji: 'aoi', es: 'Azul', blocks: ['あ', 'お', 'い'] },
          { jp: 'いえ', romaji: 'ie', es: 'Casa', blocks: ['い', 'え'] }
        ]
      }),
      buildKanaLesson({
        id: 'kana-cap-2',
        number: 2,
        title: 'Fila K: か き く け こ',
        desc: 'Combina el sonido K con las 5 vocales para formar tus primeros sustantivos.',
        ruleTitle: 'Sílabas con K (ka, ki, ku, ke, ko)',
        ruleBody: 'Al unir la consonante **K** con las cinco vocales obtenemos **か (ka), き (ki), く (ku), け (ke), こ (ko)**. Además, **か** al final de una oración funciona como signo de interrogación.',
        chars: [
          { char: 'か', romaji: 'ka', hint: '3 trazos: gancho cuadrado, línea que lo cruza y tilde derecha.' },
          { char: 'き', romaji: 'ki', hint: '4 trazos: dos líneas horizontales, diagonal y curva inferior.' },
          { char: 'く', romaji: 'ku', hint: '1 trazo en ángulo abierto como el pico de un ave.' },
          { char: 'け', romaji: 'ke', hint: '3 trazos: vertical izquierda con gancho y cruz derecha.' },
          { char: 'こ', romaji: 'ko', hint: '2 trazos horizontales paralelos ligeramente arqueados.' }
        ],
        words: [
          { jp: 'あかい', romaji: 'akai', es: 'Rojo', blocks: ['あ', 'か', 'い'] },
          { jp: 'えき', romaji: 'eki', es: 'Estación de tren', blocks: ['え', 'き'] },
          { jp: 'ここ', romaji: 'koko', es: 'Aquí', blocks: ['こ', 'こ'] },
          { jp: 'こえ', romaji: 'koe', es: 'Voz', blocks: ['こ', 'え'] }
        ]
      }),
      buildKanaLesson({
        id: 'kana-cap-3',
        number: 3,
        title: 'Fila S: さ し す せ そ',
        desc: 'Domina la fila S y la pronunciación especial de し (shi).',
        ruleTitle: 'Sílabas con S y la excepción し (shi)',
        ruleBody: 'En japonés no existe el sonido "si" como en español; en su lugar se pronuncia suave como **し (shi)**. Las demás siguen el patrón regular: **さ (sa), す (su), せ (se), そ (so)**.',
        chars: [
          { char: 'さ', romaji: 'sa', hint: '3 trazos: horizontal, diagonal que corta y base curva.' },
          { char: 'し', romaji: 'shi', hint: '1 trazo vertical que sube en curva como un anzuelo.' },
          { char: 'す', romaji: 'su', hint: '2 trazos: horizontal y vertical con bucle central.' },
          { char: 'せ', romaji: 'se', hint: '3 trazos: horizontal larga, vertical derecha y L izquierda.' },
          { char: 'そ', romaji: 'so', hint: '1 trazo continuo en zigzag arriba y curva tipo C abajo.' }
        ],
        words: [
          { jp: 'すし', romaji: 'sushi', es: 'Sushi', blocks: ['す', 'し'] },
          { jp: 'かさ', romaji: 'kasa', es: 'Paraguas', blocks: ['か', 'さ'] },
          { jp: 'そこ', romaji: 'soko', es: 'Ahí (cerca de ti)', blocks: ['そ', 'こ'] },
          { jp: 'あさ', romaji: 'asa', es: 'Mañana (temprano)', blocks: ['あ', 'さ'] }
        ]
      }),
      buildKanaLesson({
        id: 'kana-cap-4',
        number: 4,
        title: 'Fila T: た ち つ て と',
        desc: 'Aprende las sílabas con T y los dos sonidos especiales ち (chi) y つ (tsu).',
        ruleTitle: 'Fila T y sonidos ち (chi) / つ (tsu)',
        ruleBody: 'La fila T tiene dos excepciones clave: "ti" se convierte en **ち (chi)** y "tu" se convierte en **つ (tsu)**. Las otras tres son regulares: **た (ta), て (te), と (to)**.',
        chars: [
          { char: 'た', romaji: 'ta', hint: '4 trazos: cruz a la izquierda y dos líneas horizontales a la derecha.' },
          { char: 'ち', romaji: 'chi', hint: '2 trazos: horizontal arriba y curva parecida al número 5.' },
          { char: 'つ', romaji: 'tsu', hint: '1 trazo amplio y curvo como una gran ola.' },
          { char: 'て', romaji: 'te', hint: '1 trazo horizontal que baja en curva hacia la derecha.' },
          { char: 'と', romaji: 'to', hint: '2 trazos: diagonal corta superior y curva en C.' }
        ],
        words: [
          { jp: 'ちかてつ', romaji: 'chikatetsu', es: 'Metro / Subterráneo', blocks: ['ち', 'か', 'て', 'つ'] },
          { jp: 'たこ', romaji: 'tako', es: 'Pulpo', blocks: ['た', 'こ'] },
          { jp: 'とけい', romaji: 'tokei', es: 'Reloj', blocks: ['と', 'け', 'い'] },
          { jp: 'くつ', romaji: 'kutsu', es: 'Zapatos', blocks: ['く', 'つ'] }
        ]
      }),
      buildKanaLesson({
        id: 'kana-cap-5',
        number: 5,
        title: 'Fila N: な に ぬ ね の',
        desc: 'Domina los trazos de bucle de la fila N y la partícula posesiva の.',
        ruleTitle: 'Sílabas con N (na, ni, nu, ne, no)',
        ruleBody: 'Todas las sílabas de esta fila son 100% regulares: **な (na), に (ni), ぬ (nu), ね (ne), の (no)**. Presta especial atención a la cola final de **ぬ** (bucle hacia adentro) y **ね** (bucle anudado).',

    /**************************************************************
     * AUDIO TTS NATIVO JAPONÉS
     **************************************************************/
    function speakJP(text) {
      if (!('speechSynthesis' in window) || !text) return;
      const clean = text.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]*>/g, '').trim();
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      const voices = window.speechSynthesis.getVoices();
      const jpVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('ja'));
      if (jpVoice) u.voice = jpVoice;
      window.speechSynthesis.speak(u);
    }

     **************************************************************/
    function applyTheme() {
      const root = document.documentElement;
      const btn = document.getElementById('theme-btn');
      if (state.theme === 'dark') {
        root.classList.add('dark');
        if (btn) btn.textContent = '🌙';
      } else {
        root.classList.remove('dark');
        if (btn) btn.textContent = '☀️';
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    }

    function applyFuriganaState() {
      const btn = document.getElementById('furi-btn');
      if (state.showFurigana) {
        document.body.classList.remove('hide-furigana');
        if (btn) btn.className = 'px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-indigo-500/40 bg-indigo-500/15 text-indigo-400 flex items-center gap-1';
      } else {

      }
    }

    /**************************************************************
     * MOTOR DE LECCIÓN (EXPLICACIÓN -> TRAZO -> BLOQUES / FILL / INPUT)
     **************************************************************/
    let activeLesson = null;
    let lessonSteps = [];
    let currentStepIndex = 0;
    let stepAnswered = false;
    let currentStrokeScore = 0;
    let selectedBlocks = [];
    let availableBlocks = [];
    let selectedFillOption = null;

    function startLesson(moduleId, lessonId) {
      const mod = BUNPO_COURSES.find(m => m.id === moduleId);
      const lesson = mod.lessons.find(l => l.id === lessonId);
      activeLesson = lesson;
      lessonSteps = [];

      lesson.theory.forEach(t => lessonSteps.push({ stepType: 'theory', data: t }));

      if (lesson.isKanaLesson && lesson.drawChars) {
        lesson.drawChars.forEach(d => lessonSteps.push({ stepType: 'draw', data: d }));
      }

      lesson.questions.forEach(q => lessonSteps.push({ stepType: 'quiz', data: q }));

      currentStepIndex = 0;
      const modal = document.getElementById('lesson-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderCurrentLessonStep();
    }

    function startSRSSession() {
      if (state.srsQueue.length === 0) return;
      activeLesson = { id: 'srs-session', title: 'Repaso SRS' };
      lessonSteps = state.srsQueue.slice(0, 10).map(item => ({
        stepType: 'quiz',
        data: item.question,
        isSRS: true
      }));
      currentStepIndex = 0;
      const modal = document.getElementById('lesson-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderCurrentLessonStep();
    }

    function closeLessonModal() {
      const modal = document.getElementById('lesson-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      switchTab(currentTab);
    }

    function renderCurrentLessonStep() {
      stepAnswered = false;
      const body = document.getElementById('lesson-body');
      const banner = document.getElementById('feedback-banner');
      const actionBtn = document.getElementById('lesson-action-btn');
      banner.classList.add('hidden');

      const pct = Math.round(((currentStepIndex + 1) / lessonSteps.length) * 100);
      document.getElementById('lesson-progress-bar').style.width = pct + '%';
      document.getElementById('lesson-step-counter').textContent = `${currentStepIndex + 1}/${lessonSteps.length}`;

      const step = lessonSteps[currentStepIndex];

      if (step.stepType === 'theory') {
        const t = step.data;
        actionBtn.textContent = 'Continuar';
        body.innerHTML = `
          <div class="space-y-5 my-auto">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold">

            <p class="text-sm leading-relaxed text-slate-600 dark:text-slate-300 whitespace-pre-line">
              ${t.body.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 dark:text-white font-bold">$1</strong>')}
            </p>
            <div class="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/25 text-center font-bold text-sm jp-font">
              ${t.formula}
            </div>
            <div class="space-y-2.5 pt-2">
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Vocabulario y Ejemplos (Toca 🔊 para escuchar)</p>
              ${t.examples.map(ex => `
                <div class="p-3.5 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center justify-between gap-3">
                  <div>
                    <div class="jp-font text-lg font-bold">${ex.jp} <span class="text-xs font-normal text-indigo-400 ml-1">(${ex.romaji})</span></div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${ex.es}</p>
                  </div>
                  <button onclick="speakJP('${ex.audio}')" class="w-10 h-10 rounded-xl bg-indigo-500/15 text-bunpo-accent flex items-center justify-center shrink-0 active:scale-95">
                    🔊
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      if (step.stepType === 'draw') {
        const d = step.data;
        currentStrokeScore = 0;
        speakJP(d.char);
        actionBtn.textContent = 'Validar Trazo y Continuar';
        body.innerHTML = `
          <div class="space-y-4 my-auto text-center">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-500/15 text-teal-400 text-xs font-bold">
              <span>✍️ Dibuja el Carácter</span>
            </div>
            <div class="flex items-center justify-center gap-3">
              <h2 class="text-2xl font-extrabold">Traza: <span class="jp-font text-bunpo-accent text-3xl">${d.char}</span> (${d.romaji.toUpperCase()})</h2>
              <button onclick="speakJP('${d.char}')" class="w-9 h-9 rounded-xl bg-indigo-500/15 text-bunpo-accent flex items-center justify-center">🔊</button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">${d.strokes}</p>
            <div class="relative w-64 h-64 mx-auto rounded-3xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-dashed border-indigo-500/40 flex items-center justify-center overflow-hidden shadow-inner">
              <span class="jp-font text-[145px] font-bold text-slate-300/35 dark:text-slate-700/40 pointer-events-none select-none">${d.char}</span>
              <canvas id="lesson-draw-canvas" width="256" height="256" class="draw-pad absolute inset-0 w-full h-full"></canvas>
            </div>
            <div>
              <button onclick="clearCanvas('lesson-draw-canvas')" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                Borrar trazo
              </button>
            </div>
          </div>
        `;
        setTimeout(() => initDrawCanvas('lesson-draw-canvas'), 50);
        return;
      }

      if (step.stepType === 'quiz') {
        const q = step.data;
        actionBtn.textContent = 'Comprobar';
        if (q.type === 'blocks') {
          selectedBlocks = [];
          availableBlocks = [...q.pool];
          renderBlocksQuestion(q);
        } else if (q.type === 'fill') {
          selectedFillOption = null;
          renderFillQuestion(q);
        } else if (q.type === 'input') {
          renderInputQuestion(q);
        }
      }
    }

    function renderBlocksQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold">Ordenar Bloques</span>
            <button onclick="speakJP('${q.audioHint}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold flex items-center gap-1">
              🔊 Escuchar
            </button>
          </div>
          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>
          <div class="min-h-[82px] p-4 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-bunpo-lightBorder dark:border-bunpo-darkBorder flex flex-wrap items-center gap-2">
            ${selectedBlocks.length === 0
              ? `<span class="text-xs text-slate-400">Toca los bloques en el orden correcto...</span>`
              : selectedBlocks.map((b, idx) => `
                  <button onclick="unselectBlock(${idx})" class="px-4 py-2.5 rounded-xl bg-bunpo-accent text-white font-bold jp-font text-base shadow-xs">
                    ${b}
                  </button>
                `).join('')
            }
          </div>
          <div class="flex flex-wrap gap-2.5 justify-center pt-2">
            ${availableBlocks.map((b, idx) => `
              <button onclick="selectBlock(${idx})" class="px-4 py-2.5 rounded-xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder font-bold jp-font text-base shadow-xs active:scale-95 transition">
                ${b}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function selectBlock(idx) {
      if (stepAnswered) return;
      const item = availableBlocks.splice(idx, 1)[0];
      selectedBlocks.push(item);
      speakJP(item);
      renderBlocksQuestion(lessonSteps[currentStepIndex].data);
    }

    function unselectBlock(idx) {
      if (stepAnswered) return;
      const item = selectedBlocks.splice(idx, 1)[0];
      availableBlocks.push(item);
      renderBlocksQuestion(lessonSteps[currentStepIndex].data);
    }

    function renderFillQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-amber-500/15 text-amber-400 text-xs font-bold">Completar Hueco</span>
            <button onclick="speakJP('${q.audio}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold">🔊 Audio</button>
          </div>
          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>
          <div class="p-6 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder text-center jp-font text-2xl font-bold">
            ${q.jpSentence.replace('[ ___ ]', `<span class="px-3 py-1 mx-1 rounded-xl border-2 border-bunpo-accent text-bunpo-accent">${selectedFillOption || '＿＿'}</span>`)}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${q.options.map(opt => `
              <button onclick="chooseFillOption('${opt}')" class="p-4 rounded-2xl border font-bold jp-font text-lg transition ${selectedFillOption === opt ? 'bg-bunpo-accent text-white border-bunpo-accent' : 'bg-bunpo-lightCard dark:bg-bunpo-darkCard border-bunpo-lightBorder dark:border-bunpo-darkBorder'}">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function chooseFillOption(opt) {
      if (stepAnswered) return;
      selectedFillOption = opt;
      speakJP(opt);
      renderFillQuestion(lessonSteps[currentStepIndex].data);
    }

    function renderInputQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 text-xs font-bold">Escribir Respuesta</span>
            <button onclick="speakJP('${q.audio}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold">🔊 Escuchar</button>
          </div>
          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>
          <div class="p-5 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder text-center jp-font text-2xl font-bold">
            ${q.jpDisplay}
          </div>
          <input id="quiz-text-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="Escribe en romaji o japonés..." class="w-full p-4 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-bunpo-lightBorder dark:border-bunpo-darkBorder focus:border-bunpo-accent outline-none text-base font-bold text-center" />
        </div>
      `;
    }

    function handleLessonAction() {
      const step = lessonSteps[currentStepIndex];

      if (step.stepType === 'theory') {
        advanceStep();
        return;
      }

      if (step.stepType === 'draw') {
        if (!stepAnswered) {
          if (currentStrokeScore < 8) {
            showFeedback(false, 'Dibuja el trazo sobre la guía con tu dedo antes de continuar.');
            return;
          }
          stepAnswered = true;
          speakJP(step.data.char);
          showFeedback(true, `✓ ¡Trazo de ${step.data.char} (${step.data.romaji}) registrado!`);
          document.getElementById('lesson-action-btn').textContent = 'Continuar';
          return;
        } else {
          advanceStep();
          return;
        }
      }

      if (step.stepType === 'quiz') {
        if (stepAnswered) {
          advanceStep();
          return;
        }
        const q = step.data;
        let isCorrect = false;

        if (q.type === 'blocks') {
          isCorrect = JSON.stringify(selectedBlocks) === JSON.stringify(q.answer);
        } else if (q.type === 'fill') {
          if (!selectedFillOption) return;
          isCorrect = selectedFillOption === q.correct;
        } else if (q.type === 'input') {
          const val = (document.getElementById('quiz-text-input')?.value || '').trim().toLowerCase();
          if (!val) return;
          isCorrect = q.accepted.some(a => a.toLowerCase() === val);
        }

        stepAnswered = true;
        if (isCorrect) {
          speakJP(q.audio || q.audioHint || '');
          showFeedback(true, `✓ ¡Correcto! ${q.explanation.replace(/\*\*(.*?)\*\*/g, '$1')}`);
          if (step.isSRS) {
            state.srsQueue.shift();
            saveState();
          }
        } else {
          showFeedback(false, `✕ ${q.explanation.replace(/\*\*(.*?)\*\*/g, '$1')}`);
          state.srsQueue.push({ question: q, addedAt: Date.now() });
          saveState();
        }

        document.getElementById('lesson-action-btn').textContent =
          currentStepIndex === lessonSteps.length - 1 ? 'Completar Capítulo 🎉' : 'Siguiente';
      }
    }

    function showFeedback(ok, msg) {
      const banner = document.getElementById('feedback-banner');
      banner.classList.remove('hidden');
      banner.className = ok
        ? 'mb-3 p-3.5 rounded-2xl text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
        : 'mb-3 p-3.5 rounded-2xl text-xs font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30';
      banner.innerHTML = msg;
    }

    function advanceStep() {
      if (currentStepIndex < lessonSteps.length - 1) {
        currentStepIndex++;
        renderCurrentLessonStep();
      } else {
        if (activeLesson && activeLesson.id !== 'srs-session') {
          state.completedLessons[activeLesson.id] = 100;
          if (activeLesson.questions && activeLesson.questions.length > 0 && state.srsQueue.length < 5) {
            state.srsQueue.push({ question: activeLesson.questions[0], addedAt: Date.now() });
          }
          saveState();
        }
        closeLessonModal();
      }
    }

    /**************************************************************
     * LIENZO HTML5 TÁCTIL
     **************************************************************/
    function initDrawCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      ctx.strokeStyle = '#5865F2';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const start = (e) => {
        e.preventDefault();
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        currentStrokeScore++;
      };

      const end = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentStrokeScore = 0;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCourseView();
    });
  </script>
</body>
