<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bunpo" />
  <meta name="theme-color" content="#0B0F19" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" />
  <title>Bunpo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bunpo: {
              darkBg: '#0B0F19',
              darkCard: '#151C2C',
              darkBorder: '#232D42',
              lightBg: '#F6F8FC',
              lightCard: '#FFFFFF',
              lightBorder: '#E5E9F2',
              accent: '#5865F2',
              accentSoft: '#4752C4',
              teal: '#14B8A6',
              amber: '#F59E0B',
              rose: '#F43F5E',
              emerald: '#10B981'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
    }

    .jp-font {
      font-family: 'Noto Sans JP', sans-serif;
    }

    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.58em;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.85;
      transform: translateY(-2px);
    }

    body.hide-furigana rt {
      visibility: hidden;
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }

    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Highlighted particles like Bunpo */
    .pt-tag {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 6px;
      font-weight: 700;
      background: rgba(88, 101, 242, 0.18);
      color: #818CF8;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    html:not(.dark) .pt-tag {
      background: rgba(88, 101, 242, 0.12);
      color: #4F46E5;
      border-color: rgba(79, 70, 229, 0.25);
    }

    .word-token {
      display: inline-block;
      padding: 2px 3px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
    }
    .word-token:active {
      background: rgba(88, 101, 242, 0.25);
    }

    canvas.draw-pad {
      touch-action: none;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px);
      background-size: 50% 50%;
    }
  </style>
</head>
<body class="bg-bunpo-lightBg dark:bg-bunpo-darkBg text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden flex flex-col transition-colors duration-200">

  <!-- TOP HEADER -->
  <header class="safe-top px-5 pb-3 bg-bunpo-lightCard/90 dark:bg-bunpo-darkCard/90 backdrop-blur-md border-b border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-bunpo-accent flex items-center justify-center text-white font-extrabold text-lg shadow-sm jp-font">
        文
      </div>
      <div>
        <h1 class="font-bold text-base tracking-tight leading-none">Bunpo</h1>
        <p id="header-subtitle" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">JLPT N5 • Curso Completo</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Furigana quick toggle -->
      <button onclick="toggleFurigana()" id="furi-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-bunpo-lightBorder dark:border-bunpo-darkBorder bg-slate-100 dark:bg-slate-800/80 text-bunpo-accent dark:text-indigo-400 flex items-center gap-1">
        <span class="jp-font text-[11px]">あ</span> Furigana
      </button>

      <!-- Streak Counter -->
      <div class="px-2.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center gap-1 text-amber-500 font-bold text-xs">
        <span>🔥</span>
        <span id="streak-badge">1</span>
      </div>

      <!-- Theme Switch -->
      <button onclick="toggleTheme()" id="theme-btn" class="w-8 h-8 rounded-xl border border-bunpo-lightBorder dark:border-bunpo-darkBorder bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center text-sm" aria-label="Cambiar tema">
        🌙
      </button>
    </div>
  </header>

  <!-- MAIN SCROLLABLE VIEWPORT -->
  <main id="main-view" class="flex-1 overflow-y-auto no-scrollbar pb-24">
    <!-- Injected dynamically via JS -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="safe-bottom bg-bunpo-lightCard/95 dark:bg-bunpo-darkCard/95 backdrop-blur-md border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder px-4 pt-2 flex justify-around items-center z-20 shrink-0">
    <button onclick="switchTab('course')" id="nav-course" class="flex flex-col items-center py-1 px-3 rounded-xl text-bunpo-accent">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span class="text-[11px] font-semibold">Curso</span>
    </button>

    <button onclick="switchTab('review')" id="nav-review" class="relative flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span class="text-[11px] font-semibold">Repaso</span>
      <span id="srs-badge" class="hidden absolute top-0.5 right-2 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>

    <button onclick="switchTab('kana')" id="nav-kana" class="flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <span class="jp-font text-lg font-bold leading-6 mb-0.5">あア</span>
      <span class="text-[11px] font-semibold">Kana</span>
    </button>

    <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 dark:text-slate-500">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[11px] font-semibold">Progreso</span>
    </button>
  </nav>

  <!-- FULLSCREEN LESSON & QUIZ MODAL -->
  <div id="lesson-modal" class="fixed inset-0 bg-bunpo-lightBg dark:bg-bunpo-darkBg z-40 hidden flex-col justify-between">
    <!-- Modal Header -->
    <div class="safe-top px-4 pb-3 bg-bunpo-lightCard dark:bg-bunpo-darkCard border-b border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center gap-3">
      <button onclick="closeLessonModal()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-300 font-bold">
        ✕
      </button>
      <div class="flex-1 bg-slate-200 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
        <div id="lesson-progress-bar" class="bg-bunpo-accent h-full transition-all duration-300" style="width: 10%"></div>
      </div>
      <button onclick="toggleFurigana()" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 jp-font">
        振仮名
      </button>
    </div>

    <!-- Modal Body -->
    <div id="lesson-body" class="flex-1 overflow-y-auto p-5 flex flex-col justify-between max-w-lg mx-auto w-full">
      <!-- Dynamic card or question -->
    </div>

    <!-- Feedback Drawer & Next Button -->
    <div id="lesson-footer" class="safe-bottom px-5 pt-3 pb-4 bg-bunpo-lightCard dark:bg-bunpo-darkCard border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder max-w-lg mx-auto w-full">
      <div id="feedback-banner" class="hidden mb-3 p-3 rounded-xl text-sm font-medium"></div>
      <button id="lesson-action-btn" onclick="handleLessonAction()" class="w-full py-3.5 rounded-2xl bg-bunpo-accent hover:bg-bunpo-accentSoft text-white font-bold text-base shadow-lg shadow-indigo-500/20 transition active:scale-[0.99]">
        Continuar
      </button>
    </div>
  </div>

  <!-- WORD INSPECTOR POPOVER -->
  <div id="word-popover" onclick="closeWordPopover()" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-end justify-center p-4">
    <div onclick="event.stopPropagation()" class="w-full max-w-md bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder rounded-3xl p-5 shadow-2xl mb-4">
      <div class="flex items-start justify-between">
        <div>
          <span id="pop-pos" class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-400">Sustantivo</span>
          <h3 id="pop-jp" class="jp-font text-3xl font-bold mt-2">日本語</h3>
          <p id="pop-reading" class="text-sm text-indigo-400 font-medium mt-0.5">にほんご • nihongo</p>
        </div>
        <button onclick="speakCurrentPopoverWord()" class="w-12 h-12 rounded-2xl bg-bunpo-accent text-white flex items-center justify-center shadow-md active:scale-95">
          🔊
        </button>
      </div>
      <p id="pop-meaning" class="mt-3 text-base font-semibold text-slate-700 dark:text-slate-200 border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder pt-3">
        Idioma japonés
      </p>
    </div>
  </div>

    /**************************************************************
     * ESTADO PERSISTENTE DEL USUARIO
     **************************************************************/
    const STORAGE_KEY = 'bunpo_pro_state_v1';
    let state = {
      theme: 'dark',

      streak: 1,
      lastStudyDate: null,
      completedLessons: {}, // { 'hira-1': 100 }
      srsQueue: [] // [{ lessonId, qIndex, due, interval }]
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = { ...state, ...JSON.parse(raw) };
        }
      } catch (e) {}
      applyTheme();
      applyFuriganaState();
      updateStreakBadge();
      updateSRSBadge();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateStreakBadge();
      updateSRSBadge();
    }

    /**************************************************************
     * AUDIO TTS NATIVO JAPONÉS (Compatible con iOS Safari y Android Chrome)
     **************************************************************/
    function speakJP(text) {
      if (!('speechSynthesis' in window)) return;
      const clean = text.replace(/<[^>]*>/g, '').trim();
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'ja-JP';
      u.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const jpVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('ja'));
      if (jpVoice) u.voice = jpVoice;
      window.speechSynthesis.speak(u);
    }

    /**************************************************************
     * TEMA OSCURO / CLARO Y FURIGANA
     **************************************************************/
    function applyTheme() {
      const root = document.documentElement;
      const btn = document.getElementById('theme-btn');
      if (state.theme === 'dark') {
        root.classList.add('dark');
        if (btn) btn.textContent = '🌙';
      } else {
        root.classList.remove('dark');
        if (btn) btn.textContent = '☀️';
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    }

    function applyFuriganaState() {
      const btn = document.getElementById('furi-btn');
      if (state.showFurigana) {
        document.body.classList.remove('hide-furigana');
        if (btn) btn.className = 'px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-indigo-500/40 bg-indigo-500/15 text-indigo-400 flex items-center gap-1';
      } else {
        document.body.classList.add('hide-furigana');
        if (btn) btn.className = 'px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-bunpo-lightBorder dark:border-bunpo-darkBorder bg-slate-100 dark:bg-slate-800/80 text-slate-400 flex items-center gap-1';
      }
    }

    function toggleFurigana() {
      state.showFurigana = !state.showFurigana;
      saveState();
      applyFuriganaState();
    }

    function updateStreakBadge() {
      const el = document.getElementById('streak-badge');
      if (el) el.textContent = state.streak || 1;
    }

    function updateSRSBadge() {
      const badge = document.getElementById('srs-badge');
      if (!badge) return;
      const count = state.srsQueue.length;
      if (count > 0) {

        badge.classList.remove('hidden');
      } else {

    /**************************************************************
     * MOTOR DE LECCIÓN BUNPO (TEORÍA -> DIBUJO KANA -> BLOQUES / FILL / INPUT)
     **************************************************************/
    let activeLesson = null;
    let lessonSteps = [];
    let currentStepIndex = 0;
    let stepAnswered = false;
    let currentStrokeScore = 0;
    let selectedBlocks = [];
    let availableBlocks = [];
    let selectedFillOption = null;

    function startLesson(moduleId, lessonId) {
      const mod = BUNPO_COURSES.find(m => m.id === moduleId);
      const lesson = mod.lessons.find(l => l.id === lessonId);
      activeLesson = lesson;
      lessonSteps = [];

      // 1. Tarjetas de explicación estilo Bunpo
      lesson.theory.forEach(t => {
        lessonSteps.push({ stepType: 'theory', data: t });
      });

      // 2. Si es lección de alfabeto, pizarra de dibujo de cada letra antes de los bloques
      if (lesson.isKanaLesson && lesson.drawChars) {
        lesson.drawChars.forEach(d => {
          lessonSteps.push({ stepType: 'draw', data: d });
        });
      }

      // 3. Preguntas interactivas (bloques, huecos, escritura)
      lesson.questions.forEach((q, qIdx) => {
        lessonSteps.push({ stepType: 'quiz', data: q, lessonId: lesson.id, qIdx });
      });

      currentStepIndex = 0;
      openLessonModal();
      renderCurrentLessonStep();
    }

    function startSRSSession() {
      if (state.srsQueue.length === 0) return;
      activeLesson = { id: 'srs-session', title: 'Repaso SRS' };
      lessonSteps = state.srsQueue.slice(0, 8).map(item => ({
        stepType: 'quiz',
        data: item.question,
        isSRS: true
      }));
      currentStepIndex = 0;
      openLessonModal();
      renderCurrentLessonStep();
    }

    function openLessonModal() {
      const modal = document.getElementById('lesson-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeLessonModal() {
      const modal = document.getElementById('lesson-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      switchTab(currentTab);
    }

    function renderCurrentLessonStep() {
      stepAnswered = false;
      const body = document.getElementById('lesson-body');
      const banner = document.getElementById('feedback-banner');
      const actionBtn = document.getElementById('lesson-action-btn');
      banner.classList.add('hidden');

      const pct = Math.round(((currentStepIndex + 1) / lessonSteps.length) * 100);
      document.getElementById('lesson-progress-bar').style.width = pct + '%';

      const step = lessonSteps[currentStepIndex];

      // PASO A: TARJETA DE TEORÍA ESTILO BUNPO
      if (step.stepType === 'theory') {
        const t = step.data;
        actionBtn.textContent = 'Entendido • Continuar';
        actionBtn.className = 'w-full py-3.5 rounded-2xl bg-bunpo-accent text-white font-bold text-base shadow-lg shadow-indigo-500/20';

        body.innerHTML = `
          <div class="space-y-5 my-auto">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold">
              <span>📘 Explicación Gramatical</span>
            </div>

            <h2 class="text-2xl font-extrabold tracking-tight jp-font">${t.heading}</h2>

            <p class="text-sm leading-relaxed text-slate-600 dark:text-slate-300">
              ${t.body.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 dark:text-white font-bold">$1</strong>')}
            </p>

            <div class="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/25 text-center font-bold text-sm jp-font">
              ${t.formula}
            </div>

            <div class="space-y-2.5 pt-2">
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Ejemplos (Toca una palabra para analizarla o 🔊)</p>
              ${t.examples.map(ex => `
                <div class="p-4 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder flex items-center justify-between gap-3">
                  <div class="space-y-1">
                    <div class="jp-font text-lg font-bold leading-relaxed">
                      ${renderInteractiveSentence(ex.jp, ex.tokens)}
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${ex.es}</p>
                  </div>
                  <button onclick="speakJP('${ex.audio}')" class="w-10 h-10 rounded-xl bg-indigo-500/15 text-bunpo-accent flex items-center justify-center shrink-0 active:scale-95">
                    🔊
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      // PASO B: DIBUJO DE LA LETRA (SOLO EN ALFABETO)
      if (step.stepType === 'draw') {
        const d = step.data;
        currentStrokeScore = 0;
        speakJP(d.char);
        actionBtn.textContent = 'Validar Trazo y Continuar';
        actionBtn.className = 'w-full py-3.5 rounded-2xl bg-bunpo-accent text-white font-bold text-base shadow-lg shadow-indigo-500/20';

        body.innerHTML = `
          <div class="space-y-4 my-auto text-center">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-500/15 text-teal-400 text-xs font-bold">
              <span>✍️ Práctica de Escritura Kana</span>
            </div>

            <div class="flex items-center justify-center gap-3">
              <h2 class="text-2xl font-extrabold">Dibuja: <span class="jp-font text-bunpo-accent">${d.char}</span> (${d.romaji.toUpperCase()})</h2>
              <button onclick="speakJP('${d.char}')" class="w-9 h-9 rounded-xl bg-indigo-500/15 text-bunpo-accent flex items-center justify-center">🔊</button>
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">${d.strokes}</p>

            <div class="relative w-64 h-64 mx-auto rounded-3xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-dashed border-indigo-500/40 flex items-center justify-center overflow-hidden shadow-inner">
              <span class="jp-font text-[150px] font-bold text-slate-300/35 dark:text-slate-700/40 pointer-events-none select-none">${d.char}</span>
              <canvas id="lesson-draw-canvas" width="256" height="256" class="draw-pad absolute inset-0 w-full h-full"></canvas>
            </div>

            <div>
              <button onclick="clearCanvas('lesson-draw-canvas')" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                Limpiar lienzo
              </button>
            </div>
          </div>
        `;
        setTimeout(() => initDrawCanvas('lesson-draw-canvas'), 50);
        return;
      }

      // PASO C: EJERCICIOS INTERACTIVOS (BLOQUES / FILL / INPUT)
      if (step.stepType === 'quiz') {
        const q = step.data;
        actionBtn.textContent = 'Comprobar';
        actionBtn.className = 'w-full py-3.5 rounded-2xl bg-bunpo-accent text-white font-bold text-base shadow-lg shadow-indigo-500/20';

        if (q.type === 'blocks') {
          selectedBlocks = [];
          availableBlocks = [...q.pool];
          renderBlocksQuestion(q);
        } else if (q.type === 'fill') {
          selectedFillOption = null;
          renderFillQuestion(q);
        } else if (q.type === 'input') {
          renderInputQuestion(q);
        }
      }
    }

    function renderInteractiveSentence(jpHtml, tokens) {
      if (!tokens || tokens.length === 0) return jpHtml;
      return tokens.map(t => {
        const isParticle = ['は', 'を', 'に', 'で', 'の', 'か'].includes(t);
        return `<span onclick="openWordPopover('${t}')" class="word-token ${isParticle ? 'pt-tag' : ''}">${formatWithFurigana(t)}</span>`;
      }).join(' ');
    }

    function formatWithFurigana(token) {
      const map = {
        '私': '<ruby>私<rt>わたし</rt></ruby>',
        '学生': '<ruby>学生<rt>がくせい</rt></ruby>',
        '先生': '<ruby>先生<rt>せんせい</rt></ruby>',
        '日本人': '<ruby>日本人<rt>にほんじん</rt></ruby>',
        '本': '<ruby>本<rt>ほん</rt></ruby>',
        '水': '<ruby>水<rt>みず</rt></ruby>',
        '寿司': '<ruby>寿司<rt>すし</rt></ruby>',
        '食べます': '<ruby>食<rt>た</rt></ruby>べます',
        '飲みます': '<ruby>飲<rt>の</rt></ruby>みます',
        '行きます': '<ruby>行<rt>い</rt></ruby>きます',
        '行きました': '<ruby>行<rt>い</rt></ruby>きました',
        '日本': '<ruby>日本<rt>にほん</rt></ruby>',
        '東京': '<ruby>東京<rt>とうきょう</rt></ruby>',
        '京都': '<ruby>京都<rt>きょうと</rt></ruby>',
        '電車': '<ruby>電車<rt>でんしゃ</rt></ruby>',
        '美味しい': '<ruby>美味<rt>おい</rt></ruby>しい',
        '高い': '<ruby>高<rt>たか</rt></ruby>い',
        '高くないです': '<ruby>高<rt>たか</rt></ruby>くないです',
        '静か': '<ruby>静<rt>しず</rt></ruby>か',
        '買いたい': '<ruby>買<rt>か</rt></ruby>いたい',
        '行きたい': '<ruby>行<rt>い</rt></ruby>きたい',
        '見て': '<ruby>見<rt>み</rt></ruby>て'
      };
      return map[token] || token;
    }

    // 1. RENDERIZAR PREGUNTA DE ARMAR BLOQUES
    function renderBlocksQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold">Ordenar Bloques</span>
            <button onclick="speakJP('${q.audioHint}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold flex items-center gap-1">
              🔊 Escuchar
            </button>
          </div>

          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>

          <!-- Zona de respuesta -->
          <div class="min-h-[82px] p-4 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-bunpo-lightBorder dark:border-bunpo-darkBorder flex flex-wrap items-center gap-2">
            ${selectedBlocks.length === 0
              ? `<span class="text-xs text-slate-400">Toca los bloques de abajo en orden...</span>`
              : selectedBlocks.map((b, idx) => `
                  <button onclick="unselectBlock(${idx})" class="px-4 py-2.5 rounded-xl bg-bunpo-accent text-white font-bold jp-font text-base shadow-xs">
                    ${b}
                  </button>
                `).join('')
            }
          </div>

          <!-- Banco de bloques -->
          <div class="flex flex-wrap gap-2.5 justify-center pt-2">
            ${availableBlocks.map((b, idx) => `
              <button onclick="selectBlock(${idx})" class="px-4 py-2.5 rounded-xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder font-bold jp-font text-base shadow-xs active:scale-95 transition">
                ${b}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function selectBlock(idx) {
      if (stepAnswered) return;
      const item = availableBlocks.splice(idx, 1)[0];
      selectedBlocks.push(item);
      speakJP(item);
      renderBlocksQuestion(lessonSteps[currentStepIndex].data);
    }

    function unselectBlock(idx) {
      if (stepAnswered) return;
      const item = selectedBlocks.splice(idx, 1)[0];
      availableBlocks.push(item);
      renderBlocksQuestion(lessonSteps[currentStepIndex].data);
    }

    // 2. RENDERIZAR PREGUNTA DE RELLENAR HUECO (FILL-IN-THE-BLANK)
    function renderFillQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-amber-500/15 text-amber-400 text-xs font-bold">Completar Oración</span>
            <button onclick="speakJP('${q.audio}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold">🔊 Audio</button>
          </div>

          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>

          <div class="p-6 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder text-center jp-font text-2xl font-bold">
            ${q.jpSentence.replace('[ ___ ]', `<span class="px-3 py-1 mx-1 rounded-xl border-2 border-bunpo-accent text-bunpo-accent">${selectedFillOption || '＿＿'}</span>`)}
          </div>

          <div class="grid grid-cols-2 gap-3">
            ${q.options.map(opt => `
              <button onclick="chooseFillOption('${opt}')" class="p-4 rounded-2xl border font-bold jp-font text-lg transition ${selectedFillOption === opt ? 'bg-bunpo-accent text-white border-bunpo-accent' : 'bg-bunpo-lightCard dark:bg-bunpo-darkCard border-bunpo-lightBorder dark:border-bunpo-darkBorder'}">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function chooseFillOption(opt) {
      if (stepAnswered) return;
      selectedFillOption = opt;
      speakJP(opt);
      renderFillQuestion(lessonSteps[currentStepIndex].data);
    }

    // 3. RENDERIZAR PREGUNTA DE ESCRIBIR RESPUESTA (INPUT)
    function renderInputQuestion(q) {
      const body = document.getElementById('lesson-body');
      body.innerHTML = `
        <div class="space-y-6 my-auto">
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 text-xs font-bold">Escribir Respuesta</span>
            <button onclick="speakJP('${q.audio}')" class="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-bunpo-accent text-xs font-bold">🔊 Pista de voz</button>
          </div>

          <h3 class="text-lg font-bold">${q.prompt.replace(/\*\*(.*?)\*\*/g, '<span class="text-bunpo-accent">$1</span>')}</h3>

          <div class="p-5 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder text-center jp-font text-2xl font-bold">
            ${q.jpDisplay}
          </div>

          <input id="quiz-text-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="Escribe en japonés o romaji..." class="w-full p-4 rounded-2xl bg-bunpo-lightCard dark:bg-bunpo-darkCard border-2 border-bunpo-lightBorder dark:border-bunpo-darkBorder focus:border-bunpo-accent outline-none text-base font-bold text-center" />
        </div>
      `;
    }

    // VALIDACIÓN Y AVANCE DE PASO
    function handleLessonAction() {
      const step = lessonSteps[currentStepIndex];

      // Si es teoría, avanza directo
      if (step.stepType === 'theory') {
        advanceStep();
        return;
      }

      // Si es dibujo de Kana, verifica que haya dibujado sobre el lienzo
      if (step.stepType === 'draw') {
        if (!stepAnswered) {
          if (currentStrokeScore < 12) {
            showFeedback(false, 'Traza el carácter sobre la pizarra con tu dedo antes de continuar.');
            return;
          }
          stepAnswered = true;
          speakJP(step.data.char);
          showFeedback(true, `¡Excelente trazo de ${step.data.char} (${step.data.romaji})!`);
          document.getElementById('lesson-action-btn').textContent = 'Continuar';
          return;
        } else {
          advanceStep();
          return;
        }
      }

      // Si es pregunta de quiz
      if (step.stepType === 'quiz') {
        if (stepAnswered) {
          advanceStep();
          return;
        }

        const q = step.data;
        let isCorrect = false;

        if (q.type === 'blocks') {
          isCorrect = JSON.stringify(selectedBlocks) === JSON.stringify(q.answer);
        } else if (q.type === 'fill') {
          if (!selectedFillOption) return;
          isCorrect = selectedFillOption === q.correct;
        } else if (q.type === 'input') {
          const val = (document.getElementById('quiz-text-input')?.value || '').trim().toLowerCase();
          if (!val) return;
          isCorrect = q.accepted.some(a => a.toLowerCase() === val);
        }

        stepAnswered = true;

        if (isCorrect) {
          speakJP(q.audio || q.audioHint || '');
          showFeedback(true, `✓ ¡Correcto! ${q.explanation}`);
          if (step.isSRS) {
            state.srsQueue.shift();
            saveState();
          }
        } else {
          showFeedback(false, `✕ Respuesta correcta: ${q.explanation}`);
          // Agregar a la cola SRS para repasar después
          state.srsQueue.push({ question: q, addedAt: Date.now() });
          saveState();
        }

        const btn = document.getElementById('lesson-action-btn');
        btn.textContent = currentStepIndex === lessonSteps.length - 1 ? 'Finalizar Lección 🎉' : 'Siguiente';
      }
    }

    function showFeedback(ok, msg) {
      const banner = document.getElementById('feedback-banner');
      banner.classList.remove('hidden');
      if (ok) {
        banner.className = 'mb-3 p-3.5 rounded-2xl text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
      } else {
        banner.className = 'mb-3 p-3.5 rounded-2xl text-xs font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30';
      }
      banner.innerHTML = msg;
    }

    function advanceStep() {
      if (currentStepIndex < lessonSteps.length - 1) {
        currentStepIndex++;
        renderCurrentLessonStep();
      } else {
        // Lección terminada
        if (activeLesson && activeLesson.id !== 'srs-session') {
          state.completedLessons[activeLesson.id] = 100;
          // Añadir una pregunta clave de esta lección al repaso SRS si la cola está vacía
          if (activeLesson.questions && activeLesson.questions.length > 0 && state.srsQueue.length < 3) {
            state.srsQueue.push({ question: activeLesson.questions[0], addedAt: Date.now() });
          }
          saveState();
        }
        closeLessonModal();
      }
    }

    /**************************************************************
     * LIENZO HTML5 DE DIBUJO TÁCTIL (CON SOPORTE PARA IPHONE / ANDROID)
     **************************************************************/
    function initDrawCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      ctx.strokeStyle = '#5865F2';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const start = (e) => {
        e.preventDefault();
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        currentStrokeScore++;
      };

      const end = () => {
        drawing = false;
      };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentStrokeScore = 0;
    }

    /**************************************************************
     * POPOVER DE INSPECCIÓN DE PALABRAS
     **************************************************************/
    let currentPopoverWord = '';

    function openWordPopover(token) {
      const info = WORD_DICT[token];
      if (!info) {
        speakJP(token);
        return;
      }
      currentPopoverWord = info.jp;
      speakJP(info.jp);
      const pop = document.getElementById('word-popover');
      pop.innerHTML = `
        <div onclick="event.stopPropagation()" class="w-full max-w-md bg-bunpo-lightCard dark:bg-bunpo-darkCard border border-bunpo-lightBorder dark:border-bunpo-darkBorder rounded-3xl p-5 shadow-2xl mb-4">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-400">${info.pos}</span>
              <h3 class="jp-font text-3xl font-bold mt-2">${info.jp}</h3>
              <p class="text-sm text-indigo-400 font-medium mt-0.5">${info.reading}</p>
            </div>
            <button onclick="speakJP('${info.jp}')" class="w-12 h-12 rounded-2xl bg-bunpo-accent text-white flex items-center justify-center shadow-md active:scale-95">
              🔊
            </button>
          </div>
          <p class="mt-3 text-base font-semibold text-slate-700 dark:text-slate-200 border-t border-bunpo-lightBorder dark:border-bunpo-darkBorder pt-3">
            ${info.meaning}
          </p>
        </div>
      `;
      pop.classList.remove('hidden');
      pop.classList.add('flex');
    }

    function closeWordPopover() {
      const pop = document.getElementById('word-popover');
      pop.classList.add('hidden');
      pop.classList.remove('flex');
    }

    // Inicializar aplicación
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCourseView();
    });
  </script>
